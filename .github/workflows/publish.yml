# Publishes a release to PyPI when a tag vX.Y.Z is pushed.
#
# No token is stored anywhere. PyPI trusts this workflow in this repository
# ("trusted publishing"): the project's owner registers the repository and this
# file name once on pypi.org, and each run proves its identity to PyPI with a
# short-lived token that GitHub issues to the job.
name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # the short-lived identity token PyPI checks
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: The tag must equal the version in pyproject.toml
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: Tests
        run: uv run pytest -q
      - name: Build
        run: uv build
      - name: Publish
        run: uv publish
